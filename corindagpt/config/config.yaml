openai_api_key: "YOUR_OPENAI_API_KEY"
elevenlabs_api_key: "YOUR_ELEVENLABS_API_KEY"
model_names:
  text: "gpt-5.4-nano"
  transcription: "whisper-1"
performance_plan: [1, 2, 3, 4, 5]
transcription:
  provider: "elevenlabs"
  # The service will try models in order; falls back on error
  models: ["gpt-4o-transcribe", "whisper-1"]
  model: "whisper-1"
  language: "en"
  prompt: "Common phrases: Hello testing, testing one two"
  streaming_enabled: false
  streaming:
    # Engine for listening_mode: streaming.
    # gpt-live-transcribe: word-by-word deltas; punctuation synthesized from
    #   speech pauses (pause_split_ms) because the model defers it.
    # gpt-4o(-mini)-transcribe: server VAD closes each utterance at a
    #   silence (vad_silence_ms) and returns it finalized and punctuated.
    model: "gpt-live-transcribe"
    pause_split_ms: 700
    vad_silence_ms: 500
  elevenlabs:
    endpoint: "https://api.elevenlabs.io/v1/speech-to-text"
    model: "scribe_v1"
    # Single close-mic speaker; diarization and event tags only add latency
    diarize: false
    tag_audio_events: false
    language_code: null  # use ISO like 'eng'; auto if null; 'en' will map to 'eng'

transitions:
  phase_transition:
    hotkey: "f11"
    long_press_ms: 3000
  llm_phase_control:
    enabled: true
    keyphrases: ["next phase", "advance phase", "switch to phase {n}"]

dashboard:
  # Localhost-only settings page (http://127.0.0.1:<port>) for editing
  # config/settings.yaml while the show runs. Never exposed to the network.
  enabled: true
  port: 7360

network:
  # Ping OpenAI/ElevenLabs this often (seconds) to keep TLS connections hot
  # between stage interactions; 0 disables the heartbeat
  keepalive_interval_s: 60

memory:
  # Conversation turns Effie remembers (user + her own lines, incl. played phrases)
  max_turns: 10

audio_queue:
  # immediate: LLM responses stream straight to the speakers (conversational)
  # queued: responses are synthesized and parked at the queue front; the next
  #         brief input (the pull string) speaks them (doll mode, FR8)
  response_playback: "queued"
  preload:
    # Directory of clips loaded into the queue at startup (FR9).
    # Generate phrase audio from the CSV with: python -m scripts.generate_phrase_audio
    dir: "assets/phrases"
    order: "sequential"   # or "random"
    loop: true            # preloaded clips return to the back after playing

decoder:
  # Hadley-style coded-language table; first column = code phrase,
  # *-prefixed headers = categories. Edit freely - no code changes needed.
  data_path: "knowledge-base/effie_code.csv"

input_patterns:
  enabled_sources: ["keyboard"]
  # Record trigger (mic button): hold = decoded pipeline, double-tap+hold = bypass
  hotkey: "`"
  # Play trigger (pull string): tap = play next queued clip.
  # numpad_minus matches by VK code so typed hyphens can't trigger it.
  # Leave empty/absent to fold playback back onto the record hotkey's tap.
  play_hotkey: "numpad_minus"
  brief_max_ms: 250
  sustained_min_ms: 600
  compound_double_press_window_ms: 350

tts:
  provider: "elevenlabs"
  # Off: account 403s the streaming PCM endpoint, and queued doll mode needs
  # full audio up front anyway - go straight to non-streaming MP3, no wasted
  # round trip. Revisit (plan upgrade) only if response_playback: "immediate".
  streaming_enabled: false
  # Start TTS on the first complete sentence while the LLM is still generating
  sentence_streaming: true
  output_format: "pcm_16000"
  playback:
    backend: "sounddevice"
    warmup_ms: 0
    settle_ms: 0
    preroll_ms: 0
    start_delay_ms: 0
  debug:
    save_last_wav: true
    path: "last_tts.wav"
  elevenlabs:
    voice_id: "pPdl9cQBQq4p6mRkZy2Z"
    # flash_v2_5: ~200ms to first audio vs ~1100ms for eleven_multilingual_v2
    model_id: "eleven_flash_v2_5"
    voice_settings:
      stability: 0.40
      speed: 0.90
      similarity_boost: 0.40
      style: 0.00
      use_speaker_boost: false
